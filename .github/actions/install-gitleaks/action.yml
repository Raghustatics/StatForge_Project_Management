name: Install gitleaks
description: Install the pinned gitleaks release on Linux, verifying its SHA-256 checksum.
inputs:
  version:
    description: gitleaks version (keep in step with scripts/install_tools.ps1)
    default: "8.30.1"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITLEAKS_VERSION: ${{ inputs.version }}
      run: |
        base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
        tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        cd "$(mktemp -d)"
        curl -sSfLO "${base}/${tarball}"
        curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${tarball}$" | sha256sum -c -
        tar -xzf "${tarball}" gitleaks
        sudo install gitleaks /usr/local/bin/gitleaks
        gitleaks version
