# Local hooks only: every tool comes from uv / pnpm / the standalone gitleaks binary
# (AGENTS.md §4.1.5, §8). Install with: pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run --frozen ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: eslint
        name: eslint (web)
        entry: pnpm --filter @statforge/web lint
        language: system
        files: ^apps/web/
        pass_filenames: false
      - id: gitleaks
        name: gitleaks (staged)
        entry: gitleaks git --pre-commit --staged --redact --config .gitleaks.toml
        language: system
        pass_filenames: false
      - id: tc-trace
        name: tc_trace (active gate)
        entry: uv run --frozen python scripts/tc_trace.py
        language: system
        pass_filenames: false
        always_run: true
      - id: commit-guard
        name: test-first commit guard
        entry: uv run --frozen python scripts/commit_guard.py --precommit
        language: system
        pass_filenames: false
        always_run: true
