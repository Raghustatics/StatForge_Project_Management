[project]
name = "statforge-api"
version = "0.1.0"
description = "StatForge HTTP API (FastAPI)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "psycopg[binary]>=3.2",
    "boto3>=1.40",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "statforge_api"
