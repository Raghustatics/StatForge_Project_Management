name: statforge

x-required: &required
  POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first (see README Setup)}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first (see README Setup)}
  POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env first (see README Setup)}

services:
  db:
    image: postgres:18-alpine
    environment: *required
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Copy .env.example to .env first (see README Setup)}:${POSTGRES_PASSWORD:?Copy .env.example to .env first (see README Setup)}@db:5432/${POSTGRES_DB:?Copy .env.example to .env first (see README Setup)}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://s3:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Copy .env.example to .env first (see README Setup)}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Copy .env.example to .env first (see README Setup)}
      APP_ENV: ${APP_ENV:-dev}
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 3s
      timeout: 8s
      retries: 20
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s

volumes:
  db-data:
  s3-data:
