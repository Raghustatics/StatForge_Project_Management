[project]
name = "statforge"
version = "0.1.0"
description = "StatForge monorepo root (uv workspace)"
requires-python = ">=3.14"
dependencies = ["statforge-api", "statforge-engine"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "packages/engine"]

[tool.uv.sources]
statforge-api = { workspace = true }
statforge-engine = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.14",
    "mypy>=1.18",
    "httpx2",
    "pyyaml>=6",
    "types-pyyaml>=6",
    "boto3-stubs[s3]>=1.40",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["sources", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S603", "S607", "S108", "S310"]
"tests/**" = ["S101", "S603", "S607", "S108", "S310"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = ["scripts", "tests/integration"]
files = ["scripts", "tests", "apps/api/src", "apps/api/tests", "packages/engine/src", "packages/engine/tests"]
exclude = ["^sources/"]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts/tests", "apps/api/tests", "packages/engine/tests"]
pythonpath = ["scripts", "tests/integration"]
addopts = "--strict-markers -ra --import-mode=importlib -m 'not integration'"
markers = [
    "tc(id): maps a test to a gate test case, e.g. tc('TC-01.2') (AGENTS.md §4.1)",
    "integration: needs the running docker compose stack",
    "slow: long-running (cold start)",
]

[tool.coverage.run]
branch = true
source = ["scripts", "apps/api/src", "packages/engine/src"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pyright]
extraPaths = ["scripts", "tests/integration"]
