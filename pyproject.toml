[project]
name = "statforge"
version = "0.1.0"
description = "StatForge monorepo root (uv workspace)"
requires-python = ">=3.14"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.14",
    "mypy>=1.18",
    "httpx>=0.28",
    "pyyaml>=6",
    "types-pyyaml>=6",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["sources", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S603", "S607", "S108"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["scripts", "tests"]
exclude = ["^sources/"]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts/tests", "apps/api/tests", "packages/engine/tests"]
pythonpath = ["scripts"]
addopts = "--strict-markers -ra --import-mode=importlib"
markers = [
    "tc(id): maps a test to a gate test case, e.g. tc('TC-01.2') (AGENTS.md §4.1)",
    "integration: needs the running docker compose stack",
    "slow: long-running (cold start)",
]

[tool.coverage.run]
branch = true
source = ["scripts"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
